<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 574 159" role="img" aria-labelledby="title">
  <title id="title">Wall Street Oasis</title>
  <defs>
    <!-- Map the supplied navy/cyan mark to black, retaining the white face details. -->
    <filter id="bfn-ink" color-interpolation-filters="sRGB">
      <feColorMatrix type="saturate" values="0" />
      <feComponentTransfer>
        <feFuncR type="discrete" tableValues="0 0 0 1" />
        <feFuncG type="discrete" tableValues="0 0 0 1" />
        <feFuncB type="discrete" tableValues="0 0 0 1" />
      </feComponentTransfer>
    </filter>
  </defs>
  <image href="data:image/png;base64," width="574" height="159" preserveAspectRatio="none" filter="url(#bfn-ink)" />
</svg>
